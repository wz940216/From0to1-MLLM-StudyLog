# 小样本调试：冻结视觉编码器和 LLM，只训练 projector/LoRA。
DEVICE: "cuda"
MINILLAVA:
  VISION_ENCODER:
    MODEL_PATH: "models/clip-vit-base-patch16"
    FREEZE: true
    OUTPUT_DIM: 768
  LLM_DECODER:
    MODEL_PATH: "models/Qwen1.5-1.8B"
    FREEZE: true
    LORA_R: 8
    LORA_ALPHA: 32
    LORA_DROPOUT: 0.1
    MAX_NEW_TOKENS: 256
    TEMPERATURE: 0.7
    DO_SAMPLE: true
  PROJECTOR:
    INPUT_DIM: 768
    HIDDEN_DIM: 1024
DATA:
  TRAIN_DATASET:
    TASK_NAME: "COCOCaption"
    PATH: "dataset/COCOCaption"
    IMAGE_DIR: "val2017"
    ANNOTATION_FILE: "annotations/captions_val2017_multiturn.json"
    TRAIN_SPLIT: 0.9
    MAX_LENGTH: 384
    MAX_TURNS: 4
    BATCH_SIZE: 2
    NUM_WORKERS: 2
  PREPROCESS:
    IMAGE_SIZE: 224
    MAX_TEXT_LENGTH: 384
TRAINING:
  OPTIMIZER:
    TYPE: "adamw"
    LR: 1e-4
    WEIGHT_DECAY: 0.01
    BETAS: [0.9, 0.999]
  SCHEDULER:
    TYPE: "constant"
    WARMUP_STEPS: 0
    NUM_EPOCHS: 1
  GRAD_CLIP:
    MAX_NORM: 1.0
  CHECKPOINT:
    SAVE_DIR: "week14_dialogue_stability_output_control/outputs/checkpoints/projector_debug"
    SAVE_STEPS: 100
    SAVE_TOTAL_LIMIT: 2
  LOGGING:
    LOG_DIR: "week14_dialogue_stability_output_control/outputs/logs/projector_debug"
    LOG_STEPS: 5
INFERENCE:
  LOG_FILE: "week14_dialogue_stability_output_control/outputs/logs/projector_debug/infer.jsonl"
  GENERATION:
    MAX_NEW_TOKENS: 256
    TEMPERATURE: 0.7
    DO_SAMPLE: true
    TOP_P: 0.9
    TOP_K: 50
    REPETITION_PENALTY: 1.1
  BATCH_SIZE: 1
MISC:
  SEED: 42
  DEBUG: true
  RESUME_FROM: null

# DPO 偏好优化配置
DPO:
  TRAIN_FILE: "dataset/VLFeedback"  # DPO 数据来源：本地 VLFeedback、Hub 名称或普通 JSON/JSONL
  IMAGE_ROOT: null  # 普通 JSON/JSONL 中 image 为相对路径时使用；VLFeedback 通常不需要
  CHECKPOINT: null  # 可选：SFT checkpoint 路径，policy/reference 都从这里初始化
  SAVE_EXAMPLE_DATA: null  # 可选：只导出 DPO 示例 JSONL 后退出
  EXAMPLE_IMAGE: null  # 生成示例数据或 toy data 时使用的图片
  MAX_SAMPLES: null  # 调试时只取前 N 条偏好样本
  BETA: 0.1  # DPO beta，越大表示偏好约束越强
  TOY_DATA: false  # true 时不加载 VLFeedback，只使用内置两条小样本

