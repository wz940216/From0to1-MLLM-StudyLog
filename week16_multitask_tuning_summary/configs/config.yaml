
# MiniLLaVA 配置文件
# 用于参数化配置模型的所有参数

# 基础配置
DEVICE: "cuda"  # 运行设备: "cuda" 或 "cpu"

# 模型配置
MINILLAVA:
  # 视觉编码器配置
  VISION_ENCODER:
    MODEL_PATH: "models/clip-vit-base-patch16"  # CLIP ViT 模型路径
    FREEZE: true  # 是否冻结视觉编码器参数
    LR: null
    OUTPUT_DIM: 768  # 视觉特征维度 (CLIP ViT base patch16)

  # 语言解码器配置
  LLM_DECODER:
    MODEL_PATH: "models/Qwen1.5-1.8B"  # LLM 模型路径
    FREEZE: true  # 是否冻结LLM参数 (通常训练时解冻)
    LR: null
    LORA_R: 8 # None表示不使用lora
    LORA_ALPHA: 32
    LORA_DROPOUT: 0.1
    MAX_NEW_TOKENS: 512  # 生成时最大新token数
    TEMPERATURE: 0.7  # 生成温度
    DO_SAMPLE: true  # 是否采样生成

  # 投影层配置 (将视觉特征映射到语言空间)
  PROJECTOR:
    FREEZE: false
    LR: null
    INPUT_DIM: 768  # 输入维度 (视觉特征)
    HIDDEN_DIM: 2048  # 隐藏层维度

# 数据配置
DATA:
  # 训练数据
  TRAIN_DATASET:
    TASK_NAME:
     - "COCOCaption"
     - "VQA"
    PATH: 
     - "dataset/COCOCaption"
     - "dataset/VQA"
    IMAGE_DIR: 
     - "val2017"
     - "scene_img_abstract_v002_val2017"
    ANNOTATION_FILE: 
     - "annotations/captions_val2017_multiturn.json"
     - "abstract_v002_val2017_multiturn.json"
    SAMPLE_RATE: 
     - 0.7
     - 0.3
    TRAIN_SPLIT: 0.9  # 训练集比例 (剩余为验证集)
    MAX_LENGTH: 512  # 最大序列长度
    MAX_TURNS: 4  # 最多保留的对话轮数：首轮图片 + 最近 N-1 轮
    BATCH_SIZE: 4  # 批大小
    NUM_WORKERS: 4  # 数据加载器工作进程数

  # 验证数据 (可选)
  VAL_DATASET:
    PATH: "dataset/coco128"  # 验证数据集路径
    BATCH_SIZE: 4

  # 数据预处理
  PREPROCESS:
    IMAGE_SIZE: 224  # 图片resize大小
    MAX_TEXT_LENGTH: 512  # 最大文本长度

# 训练配置
TRAINING:
  # 优化器配置
  OPTIMIZER:
    TYPE: "adamw"  # 优化器类型: adamw, adam, sgd
    LR: 1e-4  # 学习率
    WEIGHT_DECAY: 0.01  # 权重衰减
    BETAS: [0.9, 0.999]  # Adam betas

  # 学习率调度器
  SCHEDULER:
    TYPE: "cosine"  # 调度器类型: cosine, linear, constant
    WARMUP_STEPS: 100  # 预热步数
    NUM_EPOCHS: 3  # 训练轮数

  # 梯度裁剪
  GRAD_CLIP:
    MAX_NORM: 1.0  # 最大梯度范数

  # 检查点保存
  CHECKPOINT:
    LOAD_PATH: null
    SAVE_DIR: "week14_dialogue_stability_output_control/outputs/checkpoints"  # 保存目录
    SAVE_STEPS: 500  # 每多少步保存一次
    SAVE_TOTAL_LIMIT: 3  # 最多保存多少个检查点

  # 日志配置
  LOGGING:
    LOG_DIR: "week14_dialogue_stability_output_control/outputs/logs"  # 日志目录
    LOG_STEPS: 10  # 每多少步记录一次

# 推理配置
INFERENCE:
  # 生成参数
  GENERATION:
    MAX_NEW_TOKENS: 512
    TEMPERATURE: 0.7
    DO_SAMPLE: true
    TOP_P: 0.9
    TOP_K: 50
    REPETITION_PENALTY: 1.1

  LOG_FILE: "week14_dialogue_stability_output_control/outputs/logs/infer.jsonl"

  # 批处理
  BATCH_SIZE: 1  # 推理批大小

# 其他配置
MISC:
  SEED: 42  # 随机种子
  DEBUG: false  # 调试模式
  RESUME_FROM: null  # 从检查点恢复训练 (路径或null)

# DPO 偏好优化配置
DPO:
  TRAIN_FILE: "dataset/VLFeedback"  # DPO 数据来源：本地 VLFeedback、Hub 名称或普通 JSON/JSONL
  IMAGE_ROOT: null  # 普通 JSON/JSONL 中 image 为相对路径时使用；VLFeedback 通常不需要
  CHECKPOINT: null  # 可选：SFT checkpoint 路径，policy/reference 都从这里初始化
  SAVE_EXAMPLE_DATA: null  # 可选：只导出 DPO 示例 JSONL 后退出
  EXAMPLE_IMAGE: null  # 生成示例数据或 toy data 时使用的图片
  MAX_SAMPLES: null  # 调试时只取前 N 条偏好样本
  BETA: 0.1  # DPO beta，越大表示偏好约束越强
  TOY_DATA: false  # true 时不加载 VLFeedback，只使用内置两条小样本

