# CPU/无 GPU 环境 smoke test 配置：只建议配合 --max-samples 跑通流程。
DEVICE: "cpu"
MINILLAVA:
  VISION_ENCODER:
    MODEL_PATH: "models/clip-vit-base-patch16"
    FREEZE: true
    OUTPUT_DIM: 768
  LLM_DECODER:
    MODEL_PATH: "models/Qwen1.5-1.8B"
    FREEZE: true
    LORA_R: 4
    LORA_ALPHA: 16
    LORA_DROPOUT: 0.1
    MAX_NEW_TOKENS: 128
    TEMPERATURE: 0.2
    DO_SAMPLE: false
  PROJECTOR:
    INPUT_DIM: 768
    HIDDEN_DIM: 512
DATA:
  TRAIN_DATASET:
    TASK_NAME: "COCOCaption"
    PATH: "dataset/COCOCaption"
    IMAGE_DIR: "val2017"
    ANNOTATION_FILE: "annotations/captions_val2017_multiturn.json"
    TRAIN_SPLIT: 0.9
    MAX_LENGTH: 256
    BATCH_SIZE: 1
    NUM_WORKERS: 0
  PREPROCESS:
    IMAGE_SIZE: 224
    MAX_TEXT_LENGTH: 256
TRAINING:
  OPTIMIZER:
    TYPE: "adamw"
    LR: 1e-4
    WEIGHT_DECAY: 0.0
    BETAS: [0.9, 0.999]
  SCHEDULER:
    TYPE: "constant"
    WARMUP_STEPS: 0
    NUM_EPOCHS: 1
  GRAD_CLIP:
    MAX_NORM: 1.0
  CHECKPOINT:
    SAVE_DIR: "week12_minillava_doc/outputs/checkpoints/caption_only_cpu"
    SAVE_STEPS: 20
    SAVE_TOTAL_LIMIT: 1
  LOGGING:
    LOG_DIR: "week12_minillava_doc/outputs/logs/caption_only_cpu"
    LOG_STEPS: 1
INFERENCE:
  LOG_FILE: "week12_minillava_doc/outputs/logs/caption_only_cpu/infer.jsonl"
  GENERATION:
    MAX_NEW_TOKENS: 128
    TEMPERATURE: 0.2
    DO_SAMPLE: false
    TOP_P: 1.0
    TOP_K: 50
    REPETITION_PENALTY: 1.0
  BATCH_SIZE: 1
MISC:
  SEED: 42
  DEBUG: true
  RESUME_FROM: null
